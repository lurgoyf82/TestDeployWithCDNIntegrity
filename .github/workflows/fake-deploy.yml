name: Fake Deploy Pipeline

on:
  push:
    branches:
      - develop_feat_cdn_integrity
  workflow_dispatch:
    inputs:
      cdnDomains:
        description: 'Override CdnDomains (uno per riga). Lascia vuoto per usare i default dello script.'
        required: false
        type: string
      filePatterns:
        description: 'Override FilePatterns (uno per riga). Lascia vuoto per usare i default dello script.'
        required: false
        type: string
      excludeFolders:
        description: 'Override ExcludeFolders (uno per riga). Lascia vuoto per usare i default dello script.'
        required: false
        type: string

jobs:
  build-test-deploy:
    name: Build, Test, Package, Deploy (Fake)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up build metadata
        id: metadata
        run: |
          set -euo pipefail
          echo "build_timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Validate repository layout
        run: |
          set -euo pipefail
          test -f README.md
          test -f index.html






          


      # ============================================================
      # STEP 1 - INPUT: inizializzazione e scelta fonte configurazione
      # ------------------------------------------------------------
      # - Inizializzare `$args` (eventuali override)
      # - Capire se ci sono input da `workflow_dispatch`
      # - Altrimenti, valutare un file JSON di override nel workspace
      # ============================================================
          
      - name: CDN Integrity Check
        shell: pwsh
        run: |
          $args = @()

          $dispatchFilePatterns = '${{ github.event.inputs.filePatterns }}'
          $dispatchCdnDomains = '${{ github.event.inputs.cdnDomains }}'
          $dispatchExcludeFolders = '${{ github.event.inputs.excludeFolders }}'

          $hasDispatchInputs =
            (-not [string]::IsNullOrWhiteSpace($dispatchFilePatterns)) -or
            (-not [string]::IsNullOrWhiteSpace($dispatchCdnDomains)) -or
            (-not [string]::IsNullOrWhiteSpace($dispatchExcludeFolders))

          if ($hasDispatchInputs) {
            if (-not [string]::IsNullOrWhiteSpace($dispatchFilePatterns)) {
              $args += '-FilePatterns'
              $args += ($dispatchFilePatterns -split "\r?\n" | ForEach-Object { $_.Trim() } | Where-Object { $_ })
            }

            if (-not [string]::IsNullOrWhiteSpace($dispatchCdnDomains)) {
              $args += '-CdnDomains'
              $args += ($dispatchCdnDomains -split "\r?\n" | ForEach-Object { $_.Trim() } | Where-Object { $_ })
            }

            if (-not [string]::IsNullOrWhiteSpace($dispatchExcludeFolders)) {
              $args += '-ExcludeFolders'
              $args += ($dispatchExcludeFolders -split "\r?\n" | ForEach-Object { $_.Trim() } | Where-Object { $_ })
            }
          }
          else {
            $overrideConfigPath = Join-Path $env:GITHUB_WORKSPACE 'tools/cdn-integrity.config.json'

            if (Test-Path -LiteralPath $overrideConfigPath) {
              $config = Get-Content -LiteralPath $overrideConfigPath -Raw | ConvertFrom-Json

              if (@($config.FilePatterns).Count -gt 0) {
                $args += '-FilePatterns'
                $args += @($config.FilePatterns)
              }

              if (@($config.CdnDomains).Count -gt 0) {
                $args += '-CdnDomains'
                $args += @($config.CdnDomains)
              }

              if (@($config.ExcludeFolders).Count -gt 0) {
                $args += '-ExcludeFolders'
                $args += @($config.ExcludeFolders)
              }
            }
          }

          Write-Host "CDN integrity - args resolved: $($args -join ' ')"






      # ============================================================
      # STEP 2 - EXEC: esecuzione dello script e cattura output JSON
      # ------------------------------------------------------------
      # - Eseguire `./tools/deployCheckCDNIntegrity.ps1 @args`
      # - Catturare STDOUT in `$json` (deve essere solo JSON)
      # ============================================================

      # ============================================================
      # STEP 3 - PARSE: parsing del JSON (contratto “machine-readable”)
      # ------------------------------------------------------------
      # - `$result = $json | ConvertFrom-Json`
      # - Il contratto atteso:
      #   - `result.successes` / `result.failures` : mappe `<filePath> -> [occ]`
      #   - `summary.*` : conteggi deterministici
      # ============================================================

      # ============================================================
      # STEP 4 - NORMALIZE: flatten delle mappe in liste di occorrenze
      # ------------------------------------------------------------
      # - Creare liste uniformi per report/annotazioni:
      #   - ogni item: `File`, `Line`, `Column`, `Cdn`, `LineText`
      # ============================================================

      # ============================================================
      # STEP 5 - REPORT: scrittura report su `$GITHUB_STEP_SUMMARY`
      # ------------------------------------------------------------
      # - Stampare conteggi (files scanned, success/failure occurrences, ecc.)
      # - Se fallimenti: elencare dettagli (file + posizione + riga)
      # ============================================================

      # ============================================================
      # STEP 6 - ANNOTATIONS: warning GitHub per ogni fallimento
      # ------------------------------------------------------------
      # - Generare `::warning file=...,line=...,col=...::...`
      # - Nota: assicurarsi che la stringa sia trattata come testo puro in pwsh
      # ============================================================

      # ============================================================
      # STEP 7 - ENFORCE: fail del job se esistono fallimenti
      # ------------------------------------------------------------
      # - Se `failure occurrences > 0` => `throw` / `exit 1`
      # - Altrimenti: output “OK” nel summary
      # ============================================================






















      - name: Fake compile
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build
          cp -R *.html *.aspx *.jsp *.php README.md CDN_TEST_PAGES.md build/
          echo "Compiled at ${{ steps.metadata.outputs.build_timestamp }}" > build/build-info.txt
          echo "Source commit ${{ steps.metadata.outputs.commit_sha }}" >> build/build-info.txt

      - name: Fake test suite
        run: |
          set -euo pipefail
          echo "Running fake tests..."
          test -s build/index.html
          echo "All fake tests passed."

      - name: Package artifact
        run: |
          set -euo pipefail
          tar -czf build-artifact.tgz build
          ls -lh build-artifact.tgz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fake-deploy-build
          path: build-artifact.tgz
          retention-days: 7

      - name: Fake deploy
        if: github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          echo "Deploying build-artifact.tgz to fake environment..."
          echo "Deployment complete."
