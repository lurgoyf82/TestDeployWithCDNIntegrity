name: Fake Deploy Pipeline

on:
  push:
    branches:
      - develop_feat_cdn_integrity
  workflow_dispatch:

concurrency:
  group: fake-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-deploy:
    name: Build, Test, Package, Deploy (Fake)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up build metadata
        id: metadata
        run: |
          set -euo pipefail
          echo "build_timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Validate repository layout
        run: |
          set -euo pipefail
          test -f README.md
          test -f index.html

      - name: Check CDN integrity
        shell: pwsh
        run: |
          $json = ./tools/deployCheckCDNIntegrity.ps1 `
            -FilePatterns `
              "*.aspx" `
              "*.ascx" `
              "*.html" `
              "*.jsp" `
              "*.php" `
            -CdnDomains `
              "http://maps.google.com" `
              "https://cdn.jsdelivr.net" `
              "https://cdnjs.cloudflare.com" `
              "https://code.jquery.com" `
              "https://maps.google.com" `
              "https://maps.googleapis.com" `
              "https://unpkg.com"

          $result = $json | ConvertFrom-Json

          $failures = @($result.Failures)
          $successes = @($result.Successes)

          Write-Host "CDN integrity - Successes: $($successes.Count) - Failures: $($failures.Count)"

          # --- Job Summary (markdown) ---
          "## CDN integrity report" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          ("- Successes: **{0}**" -f $successes.Count) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          ("- Failures: **{0}**" -f $failures.Count) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          if ($failures.Count -gt 0) {
            "### Riferimenti senza `integrity`" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

            foreach ($f in $failures) {
              $ws = $env:GITHUB_WORKSPACE.TrimEnd('/', '\')
              $full = [string]$f.File
              $relative = $full.Replace('\','/').Replace($ws.Replace('\','/').TrimEnd('/') + '/', '')

              # Annotation cliccabile
              Write-Host ("::warning file={0},line={1},col={2}::Manca 'integrity' | CDN: {3}" -f $relative, $f.Line, $f.Column, $f.Cdn)

              # Summary (una riga per occorrenza)
              ("- `{0}` (R:{1}, C:{2})  `{3}`" -f $relative, $f.Line, $f.Column, $f.LineText.Trim()) |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            }
          }
          else {
            "### OK" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            "Tutti i riferimenti CDN includono l'attributo `integrity`." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Fake compile
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build
          cp -R *.html *.aspx *.jsp *.php README.md CDN_TEST_PAGES.md build/
          echo "Compiled at ${{ steps.metadata.outputs.build_timestamp }}" > build/build-info.txt
          echo "Source commit ${{ steps.metadata.outputs.commit_sha }}" >> build/build-info.txt

      - name: Fake test suite
        run: |
          set -euo pipefail
          echo "Running fake tests..."
          test -s build/index.html
          echo "All fake tests passed."

      - name: Package artifact
        run: |
          set -euo pipefail
          tar -czf build-artifact.tgz build
          ls -lh build-artifact.tgz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fake-deploy-build
          path: build-artifact.tgz
          retention-days: 7

      - name: Fake deploy
        if: github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          echo "Deploying build-artifact.tgz to fake environment..."
          echo "Deployment complete."
